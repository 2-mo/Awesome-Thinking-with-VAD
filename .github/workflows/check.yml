name: Check research atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify committed generated files
        run: |
          git diff --exit-code -- docs catalog.md
          if [ -n "$(git status --porcelain -- docs catalog.md)" ]; then
            echo "Generated files differ from the committed catalog or site. Run npm run build and commit all output."
            git status --short -- docs catalog.md
            exit 1
          fi
